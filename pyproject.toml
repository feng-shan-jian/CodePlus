[project]
name = "codeplus"
version = "0.2.0"
description = "A terminal AI coding assistant"
requires-python = ">=3.11"
license-files = ["LICENSE"]
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.47.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
knowledge = [
    "filelock==4.0.1",
    "markdown-it-py==4.0.0",
    "pymilvus==3.0.2",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "torch==2.14.0",
    "transformers==5.17.0",
]

[project.scripts]
codeplus = "codeplus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["codeplus"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
